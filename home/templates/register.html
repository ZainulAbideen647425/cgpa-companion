{% extends "base.html" %}
{% block title %}Create account · CGPA Companion{% endblock %}
{% block body %}
<div class="auth"><div class="card">
  <a class="brand" href="{% url 'login' %}"><span class="logo" aria-hidden="true">C</span>CGPA Companion</a>
  <h1>Create your account</h1><p class="sub">Track your CGPA in one place.</p>
  {% include "partials/_messages.html" %}
  <form method="post" action="">
    {% csrf_token %}
    <div class="field"><label for="username">Username</label><input class="input" id="username" type="text" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" name="password" autocomplete="new-password" required></div>
    <button class="btn btn-block" type="submit">Create account</button>
  </form>
  <p class="auth-foot">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div></div>
{% endblock %}
