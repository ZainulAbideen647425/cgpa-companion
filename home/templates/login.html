{% extends "base.html" %}
{% block title %}Log in · CGPA Companion{% endblock %}
{% block body %}
<div class="auth"><div class="card">
  <a class="brand" href="{% url 'login' %}"><span class="logo" aria-hidden="true">C</span>CGPA Companion</a>
  <h1>Welcome back</h1><p class="sub">Log in to see your CGPA.</p>
  {% include "partials/_messages.html" %}
  <form method="post" action="">
    {% csrf_token %}
    <div class="field"><label for="username">Username</label><input class="input" id="username" type="text" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn btn-block" type="submit">Log in</button>
  </form>
  <p class="auth-foot">New here? <a href="{% url 'register' %}">Create an account</a></p>
</div></div>
{% endblock %}
