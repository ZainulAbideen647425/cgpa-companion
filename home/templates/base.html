{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}CGPA Companion{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
{% block body %}
<header class="topbar">
  <div class="container">
    <a class="brand" href="{% url 'cgpa_calculator' %}"><span class="logo" aria-hidden="true">C</span>CGPA Companion</a>
    <nav class="nav" aria-label="Main">
      {% if user.is_authenticated %}<span class="who">{{ user.username }}</span>
      <a class="btn btn-ghost btn-sm" href="{% url 'logout' %}">Log out</a>{% endif %}
    </nav>
  </div>
</header>
<main><div class="container">
  {% include "partials/_messages.html" %}
  {% block content %}{% endblock %}
</div></main>
{% endblock %}
<dialog id="confirm-dialog" aria-labelledby="cd-title">
  <h2 id="cd-title">Please confirm</h2>
  <p data-msg></p>
  <div class="actions"><button type="button" class="btn btn-ghost" data-cancel>Cancel</button><button type="button" class="btn btn-danger" data-ok>Delete</button></div>
</dialog>
<script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
